<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IoT Temperature Monitor">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="55%" stop-color="#0a1a2e"/>
      <stop offset="100%" stop-color="#10263f"/>
    </linearGradient>

    <pattern id="mot" width="90" height="90" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#00d9ff" stroke-width="1.1" opacity="0.30">
        <path d="M0 22 H32 V48 H62 V22 H90"/><path d="M16 90 V66 H48 V90"/>
        <path d="M48 0 V16 H76 V42"/><path d="M76 90 V72 H90"/>
        <circle cx="32" cy="48" r="2.4" fill="#ffb700" stroke="none"/>
        <circle cx="62" cy="22" r="2.4" fill="#00d9ff" stroke="none"/>
        <circle cx="48" cy="16" r="2.2" fill="#ffb700" stroke="none"/>
      </g>
    </pattern>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d9ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>
  <rect width="900" height="200" fill="url(#mot)"/>
  <rect width="900" height="34" fill="url(#scan)" opacity="0.5"/>

  <g fill="none" stroke="#00d9ff" stroke-width="2.4" opacity="0.85">
    <path d="M22 52 V22 H52"/><path d="M848 22 H878 V52"/>
    <path d="M22 148 V178 H52"/><path d="M848 178 H878 V148"/>
  </g>

  <text x="60" y="70" font-family="Consolas, 'Courier New', monospace" font-size="14"
        fill="#ffb700" opacity="0.78" letter-spacing="2.5">&gt; dht11 --read --wifi</text>

  <text x="60" y="120" font-family="Consolas, 'Courier New', monospace"
        font-size="38" font-weight="bold" fill="#ffb700" filter="url(#glow)"
        letter-spacing="2">IoT Temperature Monitor</text>

  <text x="62" y="152" font-family="Consolas, 'Courier New', monospace"
        font-size="15" fill="#00d9ff" opacity="0.92" letter-spacing="1.2">ESP8266 + DHT11 temperature and humidity over WiFi</text>

  <rect x="60" y="164" width="150" height="2.5" fill="#ffb700" opacity="0.85"/>
</svg>
